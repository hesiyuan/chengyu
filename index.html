<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>成语拼一拼 · Idiom Assembler</title>
<style>
  :root {
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --ink: #2B2B2B;
    --ink-soft: #6B7280;
    --border: #E5E7EB;
    --border-strong: #D1D5DB;
    --accent: #F59E0B;         /* warm amber accent */
    --accent-soft: #FEF3C7;
    --correct: #34D399;        /* gentle green */
    --correct-soft: #D1FAE5;
    --warn: #FB923C;           /* soft orange for incorrect */
    --warn-soft: #FFEDD5;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.14);
    --radius: 18px;
    --radius-sm: 14px;
    --tile: 64px;
    --font-cn: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-cn);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 40px;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / Timer ---------- */
  header {
    width: 100%;
    max-width: 560px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(var(--bg) 80%, rgba(250,250,250,0));
    padding-top: 14px;
  }
  .timer-track {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--correct), var(--accent));
    border-radius: 99px;
    transform-origin: left center;
    transition: transform 1s linear, background 0.4s ease;
  }
  .timer-fill.low { background: linear-gradient(90deg, var(--warn), #EF4444); }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px 4px;
  }
  .brand {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .logo {
    width: 26px; height: 26px;
    background: var(--accent-soft);
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 15px;
  }
  .controls { display: flex; align-items: center; gap: 10px; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 7px 12px;
    border-radius: 99px;
    box-shadow: var(--shadow-sm);
  }
  .pill .num { color: var(--ink); font-variant-numeric: tabular-nums; }
  button.icon-btn {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink-soft);
    width: 38px; height: 38px;
    border-radius: 99px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
  }
  button.icon-btn:active { transform: scale(0.92); }
  button.icon-btn:hover { background: var(--accent-soft); }

  /* ---------- Main / Card ---------- */
  main {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 8px;
  }

  .progress-text {
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  .illustration {
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: grid;
    place-items: center;
    position: relative;
  }
  .illustration img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .illustration .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--ink-soft);
    text-align: center;
    padding: 24px;
  }
  .illustration .placeholder .emoji { font-size: 54px; }
  .illustration .placeholder .hint {
    font-size: 13px; line-height: 1.5; max-width: 380px;
    color: var(--border-strong);
  }
  .illustration .badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 12px; font-weight: 600;
    padding: 5px 10px; border-radius: 99px;
  }

  /* ---------- Answer slots ---------- */
  .slots {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .slot {
    width: var(--tile);
    height: var(--tile);
    border-radius: var(--radius-sm);
    border: 2px dashed var(--border-strong);
    background: var(--card);
    display: grid;
    place-items: center;
    font-size: 30px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.16s ease, border-color 0.2s, background 0.2s;
    user-select: none;
  }
  .slot.filled {
    border-style: solid;
    border-color: var(--border);
    box-shadow: var(--shadow-sm);
    background: var(--card);
  }
  .slot.filled:active { transform: scale(0.96); }
  .slots.correct .slot {
    border-color: var(--correct);
    background: var(--correct-soft);
    animation: pop 0.4s ease;
  }
  .slots.wrong .slot {
    border-color: var(--warn);
    background: var(--warn-soft);
  }
  .slots.wrong { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ---------- Candidate pool ---------- */
  .pool {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    justify-items: center;
  }
  .tile {
    width: 100%;
    max-width: var(--tile);
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card);
    display: grid;
    place-items: center;
    font-size: 28px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s ease, box-shadow 0.16s ease, opacity 0.2s, background 0.2s;
    user-select: none;
  }
  .tile:hover { background: var(--accent-soft); box-shadow: var(--shadow-md); }
  .tile:active { transform: scale(0.96); box-shadow: var(--shadow-sm); }
  .tile.used {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30,30,30,0.32);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 40;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-lg);
    transform: translateY(100%);
    transition: transform 0.34s cubic-bezier(.22,1,.36,1);
    max-height: 82vh;
    overflow-y: auto;
  }
  .overlay.show .modal { transform: translateY(0); }
  @media (min-width: 600px) {
    .overlay { align-items: center; }
    .modal { border-radius: 24px; }
  }

  .modal .grip {
    width: 40px; height: 4px; border-radius: 99px;
    background: var(--border-strong);
    margin: 0 auto 18px;
  }
  .modal .idiom-head {
    display: flex; align-items: baseline; gap: 12px;
    flex-wrap: wrap; margin-bottom: 4px;
  }
  .modal .idiom-title { font-size: 30px; font-weight: 800; letter-spacing: 3px; }
  .modal .idiom-pinyin { font-size: 16px; color: var(--accent); font-weight: 600; }
  .modal .section { margin-top: 18px; }
  .modal .section h4 {
    margin: 0 0 6px; font-size: 13px; font-weight: 700;
    color: var(--ink-soft); letter-spacing: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .modal .section p {
    margin: 0; font-size: 15px; line-height: 1.7; color: var(--ink);
  }
  .modal .section p.example {
    background: var(--accent-soft);
    padding: 12px 14px; border-radius: 12px;
    font-style: normal;
  }
  .modal .next-btn {
    margin-top: 24px; width: 100%;
    border: none; border-radius: 14px;
    background: var(--ink);
    color: #fff; font-size: 16px; font-weight: 700;
    padding: 15px; cursor: pointer;
    font-family: var(--font-cn);
    transition: transform 0.12s ease, opacity 0.2s;
  }
  .modal .next-btn:active { transform: scale(0.98); opacity: 0.9; }

  /* ---------- Finished screen ---------- */
  .finished {
    text-align: center;
    padding: 60px 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .finished.show { display: flex; }
  .finished .big { font-size: 56px; }
  .finished h2 { margin: 0; font-size: 24px; }
  .finished p { margin: 0; color: var(--ink-soft); }
  .finished button {
    margin-top: 12px;
    border: none; border-radius: 14px;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700;
    padding: 14px 32px; cursor: pointer;
    font-family: var(--font-cn);
    box-shadow: var(--shadow-md);
    transition: transform 0.12s ease;
  }
  .finished button:active { transform: scale(0.96); }

  /* ---------- Confetti ---------- */
  #confetti {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 60;
  }

  main.hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div class="topbar">
      <div class="brand"><span class="logo">字</span>成语拼一拼</div>
      <div class="controls">
        <div class="pill">得分 <span class="num" id="score">0</span></div>
        <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
        <button class="icon-btn" id="restartBtn" title="重新开始" aria-label="重新开始">↺</button>
      </div>
    </div>
  </header>

  <main id="game">
    <div class="progress-text" id="progress">第 1 / 20 关</div>

    <div class="illustration" id="illustration">
      <div class="badge" id="illBadge">看图猜成语</div>
      <div class="placeholder" id="illPlaceholder">
        <div class="emoji">🖼️</div>
        <div class="hint" id="illHint"></div>
      </div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="pool" id="pool"></div>
  </main>

  <div class="finished" id="finished">
    <div class="big">🎉</div>
    <h2>全部完成！</h2>
    <p id="finalScore"></p>
    <button id="playAgain">再玩一次</button>
  </div>

  <!-- Definition modal -->
  <div class="overlay" id="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="grip"></div>
      <div class="idiom-head">
        <span class="idiom-title" id="mTitle"></span>
        <span class="idiom-pinyin" id="mPinyin"></span>
      </div>
      <div class="section">
        <h4>📖 释义</h4>
        <p id="mDef"></p>
      </div>
      <div class="section">
        <h4>📜 典故</h4>
        <p id="mOrigin"></p>
      </div>
      <div class="section">
        <h4>✏️ 例句</h4>
        <p class="example" id="mExample"></p>
      </div>
      <button class="next-btn" id="nextBtn">继续下一关 →</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <!-- ============ DATA ============ -->
  <script src="data.js"></script>

  <!-- ============ GAME ============ -->
  <script>
  (function () {
    "use strict";

    /* -------------------- Config -------------------- */
    const ROUND_SECONDS = 45;        // per-idiom soft timer (no stressful numbers)
    const WRONG_CLEAR_MS = 600;      // auto-clear delay after wrong answer
    const IMAGE_DIR = "images/";     // idiom illustrations live here, named by idiom
    const IMAGE_EXT = ".jpg";

    /* -------------------- Sound (hook placeholders) -------------------- */
    // Uses WebAudio to synthesize soft tones so it works with zero asset files.
    // Swap these for real audio files by replacing the play* bodies.
    let soundOn = true;
    let audioCtx = null;
    function ctx() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { audioCtx = null; }
      }
      return audioCtx;
    }
    function tone(freq, dur, type, vol) {
      if (!soundOn) return;
      const ac = ctx(); if (!ac) return;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = 0;
      o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime;
      g.gain.linearRampToValueAtTime(vol || 0.12, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur);
    }
    const playTap     = () => tone(520, 0.08, "sine", 0.08);
    const playError   = () => { tone(200, 0.18, "sawtooth", 0.10); setTimeout(() => tone(150, 0.2, "sawtooth", 0.09), 90); };
    const playSuccess = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, "triangle", 0.11), i * 90)); };

    /* -------------------- State -------------------- */
    const state = {
      index: 0,
      score: 0,
      phase: "playing",   // playing | success | failed | finished
      slots: [],          // array length 4: {char, poolId} | null
      pool: [],           // [{id, char, used}]
      timerId: null,
      remaining: ROUND_SECONDS,
      locked: false,      // input lock during validation/animations
    };

    /* -------------------- Elements -------------------- */
    const el = {
      game: document.getElementById("game"),
      progress: document.getElementById("progress"),
      illustration: document.getElementById("illustration"),
      illPlaceholder: document.getElementById("illPlaceholder"),
      illHint: document.getElementById("illHint"),
      illBadge: document.getElementById("illBadge"),
      slots: document.getElementById("slots"),
      pool: document.getElementById("pool"),
      score: document.getElementById("score"),
      timerFill: document.getElementById("timerFill"),
      overlay: document.getElementById("overlay"),
      finished: document.getElementById("finished"),
      finalScore: document.getElementById("finalScore"),
      mTitle: document.getElementById("mTitle"),
      mPinyin: document.getElementById("mPinyin"),
      mDef: document.getElementById("mDef"),
      mOrigin: document.getElementById("mOrigin"),
      mExample: document.getElementById("mExample"),
    };

    /* -------------------- Utils -------------------- */
    // Fisher-Yates shuffle
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function splitChars(idiom) { return Array.from(idiom); }

    /* -------------------- Round setup -------------------- */
    function buildPool(data) {
      const correct = splitChars(data.idiom);              // 4 chars
      const distractors = (data.distractor_characters || []).slice(0, 6);
      const all = shuffle(correct.concat(distractors));    // 10 tiles
      return all.map((ch, i) => ({ id: i, char: ch, used: false }));
    }

    function loadRound() {
      const data = IDIOMS[state.index];
      state.slots = [null, null, null, null];
      state.pool = buildPool(data);
      state.phase = "playing";
      state.locked = false;
      state.remaining = ROUND_SECONDS;

      renderIllustration(data);
      renderSlots();
      renderPool();
      updateHUD();
      startTimer();
    }

    function renderIllustration(data) {
      // Try to load a real image named after the idiom; gracefully fall back
      // to a clean placeholder that shows the scene prompt as a hint.
      el.illBadge.textContent = "看图猜成语";
      el.illustration.querySelectorAll("img").forEach((n) => n.remove());
      el.illPlaceholder.style.display = "flex";
      el.illHint.textContent = data.visual_prompt || "";

      const img = new Image();
      img.alt = "成语插图";
      img.onload = function () {
        el.illPlaceholder.style.display = "none";
        el.illustration.appendChild(img);
      };
      img.onerror = function () { /* keep placeholder */ };
      img.src = IMAGE_DIR + encodeURIComponent(data.idiom) + IMAGE_EXT;
    }

    function renderSlots() {
      el.slots.className = "slots";
      el.slots.innerHTML = "";
      state.slots.forEach((s, i) => {
        const d = document.createElement("div");
        d.className = "slot" + (s ? " filled" : "");
        d.textContent = s ? s.char : "";
        d.dataset.idx = i;
        d.addEventListener("click", () => onSlotClick(i));
        el.slots.appendChild(d);
      });
    }

    function renderPool() {
      el.pool.innerHTML = "";
      state.pool.forEach((p) => {
        const d = document.createElement("div");
        d.className = "tile" + (p.used ? " used" : "");
        d.textContent = p.char;
        d.dataset.id = p.id;
        d.addEventListener("click", () => onTileClick(p.id));
        el.pool.appendChild(d);
      });
    }

    function updateHUD() {
      el.score.textContent = state.score;
      el.progress.textContent = "第 " + (state.index + 1) + " / " + IDIOMS.length + " 关";
    }

    /* -------------------- Timer (smooth bar, no numbers) -------------------- */
    function startTimer() {
      stopTimer();
      el.timerFill.style.transition = "none";
      el.timerFill.style.transform = "scaleX(1)";
      el.timerFill.classList.remove("low");
      // force reflow so the reset applies before we animate
      void el.timerFill.offsetWidth;
      el.timerFill.style.transition = "transform 1s linear, background 0.4s ease";

      state.timerId = setInterval(() => {
        state.remaining -= 1;
        const frac = Math.max(0, state.remaining / ROUND_SECONDS);
        el.timerFill.style.transform = "scaleX(" + frac + ")";
        if (frac <= 0.25) el.timerFill.classList.add("low");
        if (state.remaining <= 0) onTimeout();
      }, 1000);
    }
    function stopTimer() {
      if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
    }
    function onTimeout() {
      stopTimer();
      // Gentle handling: reveal the answer modal without awarding points.
      state.phase = "failed";
      state.locked = true;
      openModal(IDIOMS[state.index], /*timedOut*/ true);
    }

    /* -------------------- Interaction -------------------- */
    function firstEmptySlot() {
      return state.slots.findIndex((s) => s === null);
    }

    function onTileClick(id) {
      if (state.locked || state.phase !== "playing") return;
      const p = state.pool.find((x) => x.id === id);
      if (!p || p.used) return;
      const idx = firstEmptySlot();
      if (idx === -1) return;
      p.used = true;
      state.slots[idx] = { char: p.char, poolId: p.id };
      playTap();
      renderPool();
      renderSlots();
      maybeValidate();
    }

    function onSlotClick(i) {
      if (state.locked || state.phase !== "playing") return;
      const s = state.slots[i];
      if (!s) return;
      // Return the char to the pool
      const p = state.pool.find((x) => x.id === s.poolId);
      if (p) p.used = false;
      state.slots[i] = null;
      playTap();
      renderPool();
      renderSlots();
    }

    function maybeValidate() {
      if (state.slots.some((s) => s === null)) return;
      const guess = state.slots.map((s) => s.char).join("");
      const target = IDIOMS[state.index].idiom;
      if (guess === target) onCorrect();
      else onWrong();
    }

    function onCorrect() {
      state.phase = "success";
      state.locked = true;
      stopTimer();
      state.score += 1;
      updateHUD();
      el.slots.classList.add("correct");
      playSuccess();
      burstConfetti();
      setTimeout(() => openModal(IDIOMS[state.index], false), 750);
    }

    function onWrong() {
      state.locked = true;
      el.slots.classList.remove("correct");
      el.slots.classList.add("wrong");
      playError();
      setTimeout(() => {
        // clear slots back to pool
        state.slots.forEach((s) => {
          if (s) { const p = state.pool.find((x) => x.id === s.poolId); if (p) p.used = false; }
        });
        state.slots = [null, null, null, null];
        el.slots.classList.remove("wrong");
        state.locked = false;
        renderPool();
        renderSlots();
      }, WRONG_CLEAR_MS);
    }

    /* -------------------- Modal -------------------- */
    function openModal(data, timedOut) {
      el.mTitle.textContent = data.idiom;
      el.mPinyin.textContent = data.pinyin;
      el.mDef.textContent = data.definition;
      el.mOrigin.textContent = data.origin;
      el.mExample.textContent = data.example_sentence;
      document.getElementById("nextBtn").textContent =
        (state.index + 1 >= IDIOMS.length) ? "完成 🎉" : (timedOut ? "看答案，继续 →" : "继续下一关 →");
      el.overlay.classList.add("show");
    }
    function closeModalAndAdvance() {
      el.overlay.classList.remove("show");
      setTimeout(() => {
        state.index += 1;
        if (state.index >= IDIOMS.length) return finish();
        loadRound();
      }, 260);
    }
    function finish() {
      state.phase = "finished";
      stopTimer();
      el.game.classList.add("hidden");
      el.finished.classList.add("show");
      el.finalScore.textContent = "你答对了 " + state.score + " / " + IDIOMS.length + " 个成语！";
      burstConfetti();
    }

    /* -------------------- Confetti -------------------- */
    const cv = document.getElementById("confetti");
    const cx = cv.getContext("2d");
    let confetti = [];
    function sizeCanvas() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
    sizeCanvas();
    window.addEventListener("resize", sizeCanvas);
    function burstConfetti() {
      const colors = ["#F59E0B", "#34D399", "#60A5FA", "#F472B6", "#FBBF24"];
      for (let i = 0; i < 90; i++) {
        confetti.push({
          x: cv.width / 2 + (Math.random() - 0.5) * 120,
          y: cv.height * 0.35,
          vx: (Math.random() - 0.5) * 8,
          vy: Math.random() * -9 - 3,
          g: 0.28 + Math.random() * 0.12,
          size: 5 + Math.random() * 6,
          color: colors[(Math.random() * colors.length) | 0],
          rot: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 0.3,
          life: 90 + Math.random() * 40,
        });
      }
      if (!confetti.raf) loopConfetti();
    }
    function loopConfetti() {
      confetti.raf = true;
      cx.clearRect(0, 0, cv.width, cv.height);
      confetti = confetti.filter((p) => p.life > 0);
      confetti.forEach((p) => {
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1;
        cx.save();
        cx.translate(p.x, p.y); cx.rotate(p.rot);
        cx.fillStyle = p.color;
        cx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        cx.restore();
      });
      if (confetti.length) requestAnimationFrame(loopConfetti);
      else { confetti.raf = false; cx.clearRect(0, 0, cv.width, cv.height); }
    }

    /* -------------------- Controls -------------------- */
    function restart() {
      state.index = 0;
      state.score = 0;
      el.finished.classList.remove("show");
      el.game.classList.remove("hidden");
      loadRound();
    }

    document.getElementById("restartBtn").addEventListener("click", () => { playTap(); restart(); });
    document.getElementById("playAgain").addEventListener("click", () => { playTap(); restart(); });
    document.getElementById("nextBtn").addEventListener("click", closeModalAndAdvance);
    document.getElementById("soundBtn").addEventListener("click", function () {
      soundOn = !soundOn;
      this.textContent = soundOn ? "🔊" : "🔇";
      if (soundOn) playTap();
    });
    // Close modal via backdrop tap = same as advancing
    el.overlay.addEventListener("click", (e) => { if (e.target === el.overlay) closeModalAndAdvance(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && el.overlay.classList.contains("show")) closeModalAndAdvance();
    });

    /* -------------------- Boot -------------------- */
    if (!window.IDIOMS || !IDIOMS.length) {
      el.progress.textContent = "数据加载失败：请确认 data.js 已载入";
    } else {
      loadRound();
    }
  })();
  </script>
</body>
</html>
